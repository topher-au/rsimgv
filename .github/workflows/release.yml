name: release-source
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check the tag matches the project version
        run: |
          version=$(sed -n "s/^  version: '\(.*\)',$/\1/p" meson.build)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match meson.build version $version" >&2
            exit 1
          fi
      - run: scripts/dist.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The release workflows run in parallel; whichever finishes first creates the release.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
