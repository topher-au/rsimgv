name: release-appimage
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel git cargo clang meson ninja sassc pkgconf wget file patchelf \
            desktop-file-utils squashfs-tools gtk4 libadwaita mpv opencv glib2 librsvg
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-appimage/build
          key: appimage-${{ hashFiles('Cargo.lock', 'third_party/open-svpflow/Cargo.lock') }}
          restore-keys: appimage-
      - run: packaging/appimage/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  release:
    needs: appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The release workflows run in parallel; whichever finishes first creates the release.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
