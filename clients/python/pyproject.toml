[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsimgv-api"
version = "0.1.0"
description = "Client for rsimgv's REST API: list the actions and run them"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
