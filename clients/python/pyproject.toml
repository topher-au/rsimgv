[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsimgv-api"
version = "0.1.0"
description = "Client for rsimgv's REST API: list the actions and run them"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
# Screenshot.to_image returns a Pillow image.
image = ["Pillow"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["rsimgv_api"]
