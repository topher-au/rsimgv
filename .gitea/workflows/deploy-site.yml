name: build-and-deploy
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/keybindings/actions.rs', 'data/au.topher.rsimgv.gschema.xml', '.gitea/workflows/deploy-site.yml']
  workflow_dispatch:
jobs:
  deploy:
    # The nginx document root is outside the workspace, so this needs the runner on the host itself.
    runs-on: host
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Build the site
        run: |
          set -eu
          python3 site/tools/extract_reference.py .
          python3 site/build.py

      - name: Publish to the web root
        env:
          DEST: /data/nginx/html/rsimgv
        run: |
          set -eu
          install -d "$DEST"
          # --delete removes pages that no longer exist, so the web root mirrors site/public/ exactly.
          rsync -a --delete --chmod=D755,F644 site/public/ "$DEST/"
          echo "deployed $(git rev-parse --short HEAD) to $DEST"
