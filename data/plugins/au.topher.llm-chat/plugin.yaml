api: 1
id: au.topher.llm-chat
name: LLM Chat
version: 0.1.0
description: A persistent chat in the sidebar that sends the viewed picture or frame, its filename and metadata with every message, with optional voice input and spoken replies.
runtime: python
entry: plugin.py
startup: on-demand

events: [viewer.item_changed]

contributes:
  actions:
    - id: speak_toggle
      label: Speak chat replies
      description: Turn spoken replies on or off.
      scope: global
    - id: stop_speaking
      label: Stop speaking
      description: Stop the reply being read aloud.
      scope: global
  panels:
    - id: chat
      slot: sidebar.bottom
      title: LLM Chat
  settings:
    - key: base_url
      label: API base URL
      description: An OpenAI-compatible endpoint, such as OpenAI, Open WebUI (…/api) or a local server.
      kind: string
      default: https://api.openai.com/v1
    - key: model
      label: Model
      description: A vision-capable chat completions model.
      kind: string
      default: gpt-4o-mini
    - key: api_key_env
      label: API key environment variable
      description: The variable the key is read from. Leave the variable unset for a server that needs no key.
      kind: string
      default: OPENAI_API_KEY
    - key: system_prompt
      label: System prompt
      kind: text
      default: You are a helpful assistant inside an image and video viewer. Each message comes with the item the user is looking at, its filename and its metadata. Answer about what is shown.
    - key: send_image
      label: Send the current picture or frame
      description: Attach the viewer's picture or video frame to every message.
      kind: bool
      default: true
    - key: send_metadata
      label: Send the filename and metadata
      kind: bool
      default: true
    - key: stream
      label: Stream replies
      description: Show the reply as it arrives. Turn off for a server that does not support streaming.
      kind: bool
      default: true
    - key: history_messages
      label: Messages kept in context
      description: How many of the latest messages are sent with each request. Earlier pictures are never resent.
      kind: int
      default: 20
      min: 1
      max: 200
    - key: max_tokens
      label: Maximum response tokens
      kind: int
      default: 1000
      min: 1
      max: 32768
    - key: timeout_seconds
      label: Timeout (seconds)
      kind: int
      default: 120
      min: 5
      max: 600
    - key: asr_backend
      label: Voice input
      description: "http posts the recording to an OpenAI-compatible /audio/transcriptions endpoint. command runs the program below."
      kind: choice
      choices: [off, http, command]
      default: off
    - key: asr_url
      label: Transcription base URL
      description: Empty uses the API base URL.
      kind: string
      default: ""
    - key: asr_model
      label: Transcription model
      kind: string
      default: whisper-1
    - key: asr_command
      label: Transcription command
      description: "Reads {input}, a 16 kHz mono WAV, and prints the text. For whisper.cpp add -m with a model path."
      kind: string
      default: whisper-cli --no-timestamps --no-prints -f {input}
    - key: record_command
      label: Recording command
      description: Records to {output} as WAV until it receives SIGINT.
      kind: string
      default: parecord --rate=16000 --channels=1 --file-format=wav {output}
    - key: auto_send_voice
      label: Send voice input at once
      description: Send the transcript as soon as it is ready, rather than leaving it in the message box.
      kind: bool
      default: true
    - key: tts_backend
      label: Spoken replies
      description: "http posts the reply to an OpenAI-compatible /audio/speech endpoint. command runs the program below."
      kind: choice
      choices: [off, http, command]
      default: off
    - key: tts_url
      label: Speech base URL
      description: Empty uses the API base URL.
      kind: string
      default: ""
    - key: tts_model
      label: Speech model
      kind: string
      default: tts-1
    - key: tts_voice
      label: Voice
      kind: string
      default: alloy
    - key: tts_command
      label: Speech command
      description: "Reads the text on standard input and writes audio to {output}. For example: piper --model voice.onnx --output_file {output}"
      kind: string
      default: ""
    - key: play_command
      label: Playback command
      description: Plays the audio file {input}.
      kind: string
      default: ffplay -nodisp -autoexit -loglevel quiet {input}
    - key: auto_speak
      label: Speak every reply
      description: Read each reply aloud when it finishes. The speaker button in the panel turns it on or off until the plugin reloads.
      kind: bool
      default: false
