[package]
name = "rsimgv"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Integrated file explorer and media viewer"

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
glib = "0.22"
gio = { version = "0.22", features = ["v2_80"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
futures-channel = "0.3"
opencv = { version = "0.102", default-features = false, features = ["imgproc"] }
rusqlite = "0.41"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }

[build-dependencies]
cc = "1"
