[package]
name = "rsimgv"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Integrated file explorer and media viewer"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
glib = "0.22"
gio = "0.22"
anyhow = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
futures-channel = "0.3"

[build-dependencies]
cc = "1"
